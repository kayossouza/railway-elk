input {
  http {
    host => "::"
    port => "${INPUT_PORT:8080}"
    user => "${INPUT_USER}"
    password => "${INPUT_PASSWORD}"
    codec => json
    threads => 1
    max_content_length => 1048576
  }
}
output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL}"]
    user => "logstash_writer"
    password => "${LOGSTASH_PASSWORD}"
    index => "elk-logs"
    action => "create"
    manage_template => false
    ilm_enabled => false
    data_stream => false
    ssl_enabled => false
  }
}
